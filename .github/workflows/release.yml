name: release

# Publishing a release (or pushing a tag like v1.0.0) builds both programs on
# Windows and attaches the two exes and their checksums to that release, with
# an attestation that ties the files to this commit. The release's own text
# is left alone.

on:
  push:
    tags: ["*"]
  # For a release that already exists: Actions, release, Run workflow, and
  # give its tag.
  workflow_dispatch:
    inputs:
      tag:
        description: The tag of the release to attach the programs to
        required: true

permissions:
  contents: write
  id-token: write
  attestations: write

jobs:
  windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ inputs.tag || github.ref }}
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - name: Test
        run: cargo test --no-default-features
      - name: Build
        run: cargo build --release --features gui
      - name: Checksums
        shell: pwsh
        run: |
          Copy-Item target/release/ad2edit.exe AD2Edit.exe
          Copy-Item target/release/ad2read.exe AD2Read.exe
          Get-ChildItem AD2Edit.exe, AD2Read.exe | ForEach-Object { (Get-FileHash $_ -Algorithm SHA256).Hash.ToLower() + "  " + $_.Name } | Out-File SHA256SUMS.txt -Encoding ascii
      # Attestations need a public repository; a private one skips this.
      - uses: actions/attest-build-provenance@v2
        continue-on-error: true
        with:
          subject-path: |
            AD2Edit.exe
            AD2Read.exe
      - uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ inputs.tag || github.ref_name }}
          files: |
            AD2Edit.exe
            AD2Read.exe
            SHA256SUMS.txt
