name: release

# Publishing a release (or pushing a tag like v1.0.0) builds both programs on
# Windows and attaches the two exes and their checksums to that release, with
# an attestation that ties the files to this commit. The release's own text
# is left alone.

on:
  push:
    tags: ["v*"]

permissions:
  contents: write
  id-token: write
  attestations: write

jobs:
  windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - name: Test
        run: cargo test --no-default-features
      - name: Build
        run: cargo build --release --features gui
      - name: Checksums
        shell: pwsh
        run: |
          Copy-Item target/release/ad2edit.exe, target/release/ad2read.exe .
          Get-ChildItem ad2edit.exe, ad2read.exe | ForEach-Object { (Get-FileHash $_ -Algorithm SHA256).Hash.ToLower() + "  " + $_.Name } | Out-File SHA256SUMS.txt -Encoding ascii
      - uses: actions/attest-build-provenance@v2
        with:
          subject-path: |
            ad2edit.exe
            ad2read.exe
      - uses: softprops/action-gh-release@v2
        with:
          files: |
            ad2edit.exe
            ad2read.exe
            SHA256SUMS.txt
